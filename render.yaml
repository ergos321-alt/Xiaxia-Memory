services:
  - type: web
    name: xiaxia-memory-v1
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn mcp_app:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: MEMORY_API_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: QWEN_API_KEY
        sync: false
