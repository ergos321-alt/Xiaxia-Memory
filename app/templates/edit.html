{% extends 'base.html' %}{% block content %}<h1>编辑 Memory</h1><form class="editor" method="post"><label>内容<textarea name="memory_text" rows="6" required>{{memory.memory_text}}</textarea></label><label>类型<select name="category">{% for x in ['semantic','episodic','relationship','taste','ongoing'] %}<option {% if memory.category==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>子类型<input name="subtype" value="{{memory.subtype or ''}}"></label><label>重要度<input name="importance" type="number" min="1" max="10" value="{{memory.importance}}"></label><label>发生时间<input name="occurred_at" value="{{memory.occurred_at.isoformat()}}"></label><label>状态<select name="status">{% for x in ['active','historical','superseded','archived'] %}<option {% if memory.status==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>来源<input name="source" value="{{memory.source}}"></label><button>保存修改</button></form>{% endblock %}
